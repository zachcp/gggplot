name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check
        run: deno task check
      - name: Test
        run: deno task test
      - name: Test Python bridge
        run: python3 -m unittest discover -s tools/pytorch_bridge/tests
      - name: Build site
        run: deno task build
