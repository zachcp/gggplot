name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Format and lint
        run: deno task lint
      - name: Check
        run: deno task check
      - name: Test
        run: deno task test
      - name: Test Python bridge
        run: python3 -m unittest discover -s tools/pytorch_bridge/tests
      - name: Build site
        run: deno task build
      # After the build, so the dist-size ceiling has something to measure.
      # Counts and per-policy byte totals are deterministic and compared
      # exactly; parse time is only bounded by a generous ceiling.
      - name: Model inspection gate
        run: deno task model:perf:check

  # Non-blocking by design, and the reason matters: these gates need a real
  # WebGPU device. Measured 2026-08-25 (gggplot-5xq), a GPU-less runner falling
  # back to SwiftShader fails 17 of 17 routes with invalid-texture and lost-
  # instance errors -- infrastructure failures, not code failures. Standard
  # GitHub runners have no GPU, so the GPU-dependent steps are non-blocking and
  # report warnings rather than failing the job. Setup and artifact failures
  # remain blocking.
  #
  # The deploy-base step is the exception and DOES block: it asserts on
  # network status codes rather than pixels, so it is unaffected by
  # SwiftShader (gggplot-1jn).
  #
  # It is still worth running: the logs and uploaded report say WHY it failed,
  # so the day this starts passing (a GPU runner, or SwiftShader closing the
  # gap) it converts into a real gate by removing the step-level
  # continue-on-error settings.
  browser-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install Chromium
        run: deno run -A npm:playwright@^1.61.1 install --with-deps chromium
      # Blocking, unlike the two gates below. This one asserts on network
      # status codes and error boundaries, not on rendered pixels, so
      # SwiftShader's inability to draw WebGPU does not affect its result
      # (verified: it passes clean under the same SwiftShader args). A
      # root-absolute asset URL 404s under a subpath deploy whether or not
      # anything renders, which is exactly the defect it exists to catch.
      - name: Deploy-base assets
        env:
          GGGPLOT_CHROMIUM_ARGS: "--use-angle=swiftshader --enable-unsafe-swiftshader --use-gl=swiftshader"
        run: deno task --cwd apps/site test:base-path
      - name: Route health
        # SwiftShader is expected to fail today, but the independent re-render
        # gate below must still execute and report its own result.
        continue-on-error: true
        env:
          GGGPLOT_CHROMIUM_ARGS: "--use-angle=swiftshader --enable-unsafe-swiftshader --use-gl=swiftshader"
        run: deno task --cwd apps/site test:visual
      - name: Re-render safety
        continue-on-error: true
        env:
          GGGPLOT_CHROMIUM_ARGS: "--use-angle=swiftshader --enable-unsafe-swiftshader --use-gl=swiftshader"
        run: deno task --cwd apps/site test:rerender
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-gates-report
          path: apps/site/.artifacts/visual-smoke/
          if-no-files-found: ignore
