name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Format and lint
        run: deno task lint
      - name: Check
        run: deno task check
      - name: Test
        run: deno task test
      - name: Test Python bridge
        run: python3 -m unittest discover -s tools/pytorch_bridge/tests
      - name: Build site
        run: deno task build
      # After the build, so the dist-size ceiling has something to measure.
      # Counts and per-policy byte totals are deterministic and compared
      # exactly; parse time is only bounded by a generous ceiling.
      - name: Model inspection gate
        run: deno task model:perf:check

  # WebGPU on SwiftShader. Standard GitHub runners have no GPU, so Chromium
  # runs WebGPU on SwiftShader (Vulkan) and draws the same frames as a real GPU
  # within the gates' tolerances (gggplot-w760).
  #
  # The flags are load-bearing; scripts/browser_args.ts says why. The old
  # --use-angle=swiftshader --use-gl=swiftshader set gave a working adapter
  # but no canvas swap chain, so every chart lost its WebGPU instance on its
  # first frame. That was misread as SwiftShader being unable to run use.GPU
  # (gggplot-5xq, 2026-08-25), and these gates were non-blocking until w760.
  # The WebGPU probe runs first, so a broken adapter shows up as an adapter
  # failure and not as a pile of gggplot ones.
  browser-gates:
    runs-on: ubuntu-latest
    env:
      GGGPLOT_CHROMIUM_ARGS: "--enable-features=Vulkan --use-vulkan=swiftshader --use-angle=swiftshader --enable-unsafe-swiftshader"
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install Chromium
        run: deno run -A npm:playwright@^1.61.1 install --with-deps chromium
      # Render, read back and compute on a canvas, no gggplot involved. On
      # failure, rerun with Chromium's stderr, which names the cause (a GPU
      # process that will not start, a shared image it cannot make).
      - name: WebGPU probe
        run: |
          deno task --cwd apps/site test:webgpu-probe || {
            DEBUG=pw:browser deno task --cwd apps/site test:webgpu-probe 2>&1 |
              grep -E '\[err\]' | grep -v dbus || true
            exit 1
          }
      # A root-absolute asset URL 404s under a subpath deploy, the defect this
      # one exists to catch (gggplot-1jn).
      - name: Deploy-base assets
        run: deno task --cwd apps/site test:base-path
      - name: Route health
        run: deno task --cwd apps/site test:visual
      - name: Re-render safety
        run: deno task --cwd apps/site test:rerender
      # The resident coverage floors gggplot-vs7.11 set (70.4%
      # residentCategoricalCount, 27.4% groupedHistogram), enforced
      # (gggplot-vs7.16).
      - name: Pixel visibility
        run: deno task --cwd apps/site test:pixels
      # Every doc example's JSX against the compile-path golden frames
      # (gggplot-w8zq, apps/site/goldens/README.md).
      - name: Golden frames
        run: deno task --cwd apps/site test:goldens
      # The component-first root against compile() (gggplot-2bj): pixel parity
      # plus the component-path invariants (gggplot-bv0, docs/ARCHITECTURE.md):
      # resize, a fixed aesthetic beside a GPU-bound one, an inserted layer, a
      # touched column. The CPU half of each invariant is also pinned by
      # headless tests in `deno task test`.
      - name: Component root and invariants
        run: deno task --cwd apps/site test:component-root
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-gates-report
          path: apps/site/.artifacts/visual-smoke/
          if-no-files-found: ignore
